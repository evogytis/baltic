name: tests

# Runs on every push to main and every pull request:
# - unit: baltic's own fast tests in tests/
# - external: the real-tree suite in phylo-baltic/baltic-tests, run against this exact commit
#   (for a pull request, GitHub's trial merge of the PR into main)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"] # oldest supported (setup.py python_requires) and newest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install baltic and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q

  external:
    name: baltic-tests
    uses: phylo-baltic/baltic-tests/.github/workflows/tests.yml@main
    with:
      baltic-repository: ${{ github.repository }}
      baltic-ref: ${{ github.sha }}
